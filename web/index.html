<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DT 검사플랫폼 시나리오 재생</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>WP5 검사셀 디지털트윈</h1>
  <select id="scen" aria-label="시나리오"></select>
  <button id="prev" title="이전 데이터 교환">⏮ 이전</button>
  <button id="play" class="primary">▶ 재생</button>
  <button id="next" title="다음 데이터 교환">⏭ 다음</button>
  <select id="speed" aria-label="속도"><option>1</option><option>4</option><option selected>8</option><option>16</option></select>×
  <span id="clock">0:00 / 0:00</span>
  <button id="fs">전체 화면</button>
  <span id="conn" class="muted"></span>
</header>
<div id="tl"></div>
<nav id="tabs" role="tablist"></nav>
<main id="panes"></main>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module" src="js/main.js"></script>

</html>
